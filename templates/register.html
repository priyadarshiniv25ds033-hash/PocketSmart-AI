<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Create Account - PocketSmart</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      font-family: Arial, Helvetica, sans-serif;
      background: #ffffff;
      color: #173b5f;
    }

    .page {
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding-top: 35px;
    }

    .brand-title {
      text-align: center;
      margin-bottom: 22px;
    }

    .brand-title h1 {
      margin: 0;
      font-size: 30px;
      font-weight: 700;
      color: #245b91;
    }

    .brand-title p {
      margin: 5px 0 0;
      font-size: 13px;
      font-weight: 600;
      color: #555;
    }

    .register-wrapper {
      width: 100%;
      max-width: 400px;
      padding: 12px;
      background: #fafafa;
      border-radius: 25px;
      box-shadow: 0 5px 25px rgba(30, 70, 100, 0.08);
    }

    .register-card {
      background: #ffffff;
      border-radius: 16px;
      padding: 30px 30px 25px;
      box-shadow: 0 3px 15px rgba(0, 0, 0, 0.08);
    }

    .register-card h2 {
      text-align: center;
      margin: 0 0 28px;
      color: #173b5f;
      font-size: 23px;
    }

    .form-group {
      margin-bottom: 17px;
    }

    .form-group label {
      display: block;
      margin-bottom: 8px;
      color: #173b5f;
      font-size: 12px;
      font-weight: 700;
    }

    .input-wrapper {
      position: relative;
    }

    .input-icon {
      position: absolute;
      left: 12px;
      top: 50%;
      transform: translateY(-50%);
      color: #3976ad;
      font-size: 12px;
      z-index: 2;
    }

    .input-wrapper input {
      width: 100%;
      height: 34px;
      border: 1px solid #dfe5e9;
      border-radius: 7px;
      padding: 0 12px 0 35px;
      font-size: 12px;
      outline: none;
      color: #333;
      background: #fff;
    }

    .input-wrapper input:focus {
      border-color: #3976ad;
      box-shadow: 0 0 0 2px rgba(57, 118, 173, 0.08);
    }

    .input-wrapper input::placeholder {
      color: #999;
    }

    .create-btn {
      width: 100%;
      height: 35px;
      margin-top: 3px;
      border: none;
      border-radius: 20px;
      background: linear-gradient(90deg, #3979b9, #12395f);
      color: white;
      font-size: 12px;
      font-weight: 700;
      cursor: pointer;
      box-shadow: 0 4px 12px rgba(42, 99, 151, 0.25);
    }

    .create-btn:hover {
      opacity: 0.95;
    }

    .bottom-text {
      text-align: center;
      margin: 20px 0 0;
      color: #444;
      font-size: 12px;
    }

    .bottom-text a {
      color: #3976ad;
      font-weight: 700;
      text-decoration: none;
    }

    .bottom-text a:hover {
      text-decoration: underline;
    }

    #errorBox {
      margin-top: 12px;
    }

    .error-box {
      padding: 8px;
      border-radius: 6px;
      background: #ffe8e8;
      color: #b00020;
      font-size: 12px;
      text-align: center;
    }

    @media (max-width: 500px) {
      .page {
        padding-top: 25px;
      }

      .brand-title h1 {
        font-size: 27px;
      }

      .register-wrapper {
        max-width: 92%;
      }

      .register-card {
        padding: 28px 25px 23px;
      }
    }
  </style>
</head>

<body>

  <div class="page">

    <div class="brand-title">
      <h1>PocketSmart</h1>
      <p>AI-Powered Budget Planning</p>
    </div>

    <div class="register-wrapper">

      <div class="register-card">

        <h2>Create Your Account</h2>

        <form id="registerForm">

          <div class="form-group">
            <label>Username</label>

            <div class="input-wrapper">
              <span class="input-icon">👤</span>
              <input
                type="text"
                name="username"
                placeholder="Choose a username"
                required
              >
            </div>
          </div>

          <div class="form-group">
            <label>Email</label>

            <div class="input-wrapper">
              <span class="input-icon">✉</span>
              <input
                type="email"
                name="email"
                placeholder="Enter your email"
                required
              >
            </div>
          </div>

          <div class="form-group">
            <label>Password</label>

            <div class="input-wrapper">
              <span class="input-icon">🔒</span>
              <input
                type="password"
                name="password"
                placeholder="Create a strong password"
                required
              >
            </div>
          </div>

          <div class="form-group">
            <label>Confirm Password</label>

            <div class="input-wrapper">
              <span class="input-icon">●</span>
              <input
                type="password"
                id="confirmPassword"
                name="confirm_password"
                placeholder="Confirm your password"
                required
              >
            </div>
          </div>

          <button type="submit" class="create-btn">
            Create Account 👤+
          </button>

        </form>

        <div id="errorBox"></div>

        <p class="bottom-text">
          Already have an account?
          <a href="/login">Sign In</a>
        </p>

      </div>
    </div>

  </div>

  <script>
    document.getElementById("registerForm").addEventListener("submit", async (e) => {

      e.preventDefault();

      const password = document.querySelector('input[name="password"]').value;
      const confirmPassword = document.getElementById("confirmPassword").value;

      if (password !== confirmPassword) {
        document.getElementById("errorBox").innerHTML =
          `<div class="error-box">Passwords do not match</div>`;
        return;
      }

      const formData = new FormData(e.target);

      const res = await fetch("/register", {
        method: "POST",
        body: formData
      });

      if (res.redirected) {
        window.location.href = res.url;
      } else {
        const data = await res.json().catch(() => ({
          detail: "Registration failed"
        }));

        document.getElementById("errorBox").innerHTML =
          `<div class="error-box">${data.detail || "Registration failed"}</div>`;
      }

    });
  </script>

</body>
</html>
