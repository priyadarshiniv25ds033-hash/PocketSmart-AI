<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Party Budget Planner - PocketSmart</title>

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: Arial, Helvetica, sans-serif;
            background: #f3f5f9;
            color: #263238;
        }

        /* NAVBAR */

        .navbar {
            background: #12395c;
            color: white;
            height: 55px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 0 28px;
        }

        .brand {
            font-size: 18px;
            font-weight: bold;
        }

        .nav-links {
            display: flex;
            align-items: center;
            gap: 18px;
        }

        .nav-links a {
            color: white;
            text-decoration: none;
            font-size: 12px;
        }

        .nav-links a:hover {
            text-decoration: underline;
        }

        /* HEADER */

        .hero {
            background: linear-gradient(120deg, #214f7d, #3978bd);
            color: white;
            text-align: center;
            padding: 30px 15px;
        }

        .hero h1 {
            font-size: 25px;
            margin-bottom: 7px;
        }

        .hero p {
            font-size: 13px;
        }

        /* MAIN */

        .container {
            width: 90%;
            max-width: 720px;
            margin: 25px auto;
        }

        .planner-card {
            background: white;
            padding: 20px;
            border-radius: 10px;
            box-shadow: 0 3px 14px rgba(0, 0, 0, 0.10);
        }

        /* SECTION */

        .section {
            background: #f8f8fb;
            border: 1px solid #e3e6eb;
            border-radius: 8px;
            padding: 15px;
            margin-bottom: 13px;
        }

        .section-title {
            color: #315f8d;
            font-size: 14px;
            font-weight: bold;
            margin-bottom: 12px;
        }

        /* FORM GRID */

        .form-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 14px;
        }

        .form-group {
            display: flex;
            flex-direction: column;
        }

        .form-group label {
            font-size: 12px;
            color: #455a64;
            margin-bottom: 6px;
            font-weight: bold;
        }

        input,
        select,
        textarea {
            width: 100%;
            border: 1px solid #d9dee5;
            border-radius: 5px;
            background: white;
            padding: 10px;
            font-size: 12px;
            outline: none;
        }

        input:focus,
        select:focus,
        textarea:focus {
            border-color: #3978bd;
        }

        textarea {
            min-height: 90px;
            resize: vertical;
        }

        /* CHECKBOXES */

        .needs {
            display: grid;
            grid-template-columns: 1fr 1fr 1fr;
            gap: 10px;
        }

        .need-option {
            border: 1px solid #c9d5e2;
            background: white;
            border-radius: 5px;
            padding: 11px 8px;
            cursor: pointer;
            font-size: 12px;
            display: flex;
            align-items: center;
            gap: 7px;
        }

        .need-option:hover {
            background: #f2f7fc;
        }

        .need-option input {
            width: auto;
        }

        /* BUTTON */

        .generate-btn {
            width: 100%;
            border: none;
            border-radius: 5px;
            background: #3978bd;
            color: white;
            padding: 12px;
            font-size: 13px;
            font-weight: bold;
            cursor: pointer;
        }

        .generate-btn:hover {
            background: #285f96;
        }

        .generate-btn:disabled {
            opacity: 0.7;
            cursor: not-allowed;
        }

        /* MESSAGE */

        #message {
            display: none;
            margin-top: 12px;
            padding: 10px;
            border-radius: 5px;
            font-size: 12px;
            text-align: center;
        }

        .error {
            background: #fff0f0;
            color: #b3261e;
            border: 1px solid #efb5b5;
        }

        /* FOOTER */

        footer {
            background: #12395c;
            color: white;
            text-align: center;
            padding: 12px;
            font-size: 10px;
            margin-top: 30px;
        }

        /* MOBILE */

        @media (max-width: 650px) {

            .navbar {
                padding: 0 15px;
            }

            .nav-links {
                gap: 8px;
            }

            .nav-links a {
                font-size: 9px;
            }

            .hero h1 {
                font-size: 21px;
            }

            .form-grid {
                grid-template-columns: 1fr;
            }

            .needs {
                grid-template-columns: 1fr;
            }

            .container {
                width: 94%;
            }
        }
    </style>
</head>

<body>

    <!-- NAVBAR -->

    <nav class="navbar">

        <div class="brand">
            📁 PocketSmart
        </div>

        <div class="nav-links">

            <a href="/dashboard">
                🏠 Home Planner
            </a>

            <a href="/party-planner">
                🎉 Party Planner
            </a>

            <a href="/jewelry-planner">
                💎 Jewelry Planner
            </a>

            <a href="/history">
                ↩ History
            </a>

            <a href="/logout">
                ⇥ Logout
            </a>

        </div>

    </nav>


    <!-- PAGE HEADER -->

    <section class="hero">

        <h1>Party Budget Planner</h1>

        <p>
            Plan your perfect event with AI-powered budget recommendations
        </p>

    </section>


    <!-- PLANNER -->

    <main class="container">

        <div class="planner-card">

            <form id="partyForm">


                <!-- BASIC INFORMATION -->

                <div class="section">

                    <div class="section-title">
                        💰 Basic Information
                    </div>

                    <div class="form-grid">

                        <div class="form-group">

                            <label for="total_budget">
                                Total Budget (₹)
                            </label>

                            <input
                                type="number"
                                id="total_budget"
                                name="total_budget"
                                placeholder="5000"
                                min="1"
                                required
                            >

                        </div>


                        <div class="form-group">

                            <label for="num_guests">
                                Number of Guests
                            </label>

                            <input
                                type="number"
                                id="num_guests"
                                name="num_guests"
                                placeholder="3"
                                min="1"
                                required
                            >

                        </div>

                    </div>

                </div>


                <!-- EVENT DETAILS -->

                <div class="section">

                    <div class="section-title">
                        🎉 Event Details
                    </div>

                    <div class="form-grid">

                        <div class="form-group">

                            <label for="party_type">
                                Party Type
                            </label>

                            <select
                                id="party_type"
                                name="party_type"
                                required
                            >

                                <option value="Birthday">
                                    Birthday
                                </option>

                                <option value="Wedding">
                                    Wedding
                                </option>

                                <option value="Engagement">
                                    Engagement
                                </option>

                                <option value="Anniversary">
                                    Anniversary
                                </option>

                                <option value="Baby Shower">
                                    Baby Shower
                                </option>

                                <option value="Other">
                                    Other
                                </option>

                            </select>

                        </div>


                        <div class="form-group">

                            <label for="venue_type">
                                Venue Type
                            </label>

                            <select
                                id="venue_type"
                                name="venue_type"
                                required
                            >

                                <option value="Home">
                                    Home
                                </option>

                                <option value="Hall">
                                    Hall
                                </option>

                                <option value="Restaurant">
                                    Restaurant
                                </option>

                                <option value="Outdoor">
                                    Outdoor
                                </option>

                                <option value="Hotel">
                                    Hotel
                                </option>

                            </select>

                        </div>

                    </div>

                </div>


                <!-- PARTY NEEDS -->

                <div class="section">

                    <div class="section-title">
                        🎯 Party Needs
                    </div>

                    <div class="needs">

                        <label class="need-option">

                            <input
                                type="checkbox"
                                name="catering"
                                value="true"
                                checked
                            >

                            🍽 Catering

                        </label>


                        <label class="need-option">

                            <input
                                type="checkbox"
                                name="decoration"
                                value="true"
                                checked
                            >

                            🎈 Decoration

                        </label>


                        <label class="need-option">

                            <input
                                type="checkbox"
                                name="entertainment"
                                value="true"
                                checked
                            >

                            🎵 Entertainment

                        </label>

                    </div>

                </div>


                <!-- ADDITIONAL REQUIREMENTS -->

                <div class="section">

                    <div class="section-title">
                        💬 Additional Requirements
                    </div>

                    <div class="form-group">

                        <textarea
                            id="additional_requirements"
                            name="additional_requirements"
                            placeholder="Special requests, themes, dietary restrictions, etc."
                        ></textarea>

                    </div>

                </div>


                <!-- BUTTON -->

                <button
                    type="submit"
                    class="generate-btn"
                    id="generateBtn"
                >
                    ⚙ Generate Budget Plan
                </button>


                <div id="message"></div>

            </form>

        </div>

    </main>


    <!-- FOOTER -->

    <footer>
        © 2025 PocketSmart. All rights reserved.
    </footer>


    <script>

        const form = document.getElementById("partyForm");
        const button = document.getElementById("generateBtn");
        const message = document.getElementById("message");


        form.addEventListener("submit", async function(event) {

            event.preventDefault();

            button.disabled = true;
            button.textContent = "Generating...";

            message.style.display = "none";
            message.textContent = "";


            const formData = new FormData(form);

            const data = {

                total_budget: Number(
                    formData.get("total_budget")
                ),

                num_guests: Number(
                    formData.get("num_guests")
                ),

                party_type:
                    formData.get("party_type"),

                venue_type:
                    formData.get("venue_type"),

                catering:
                    formData.get("catering") === "true",

                decoration:
                    formData.get("decoration") === "true",

                entertainment:
                    formData.get("entertainment") === "true",

                additional_requirements:
                    formData.get("additional_requirements") || ""

            };


            try {

                const response = await fetch(
                    "/party-budget",
                    {
                        method: "POST",

                        headers: {
                            "Content-Type": "application/json"
                        },

                        body: JSON.stringify(data)
                    }
                );


                if (!response.ok) {

                    const errorText =
                        await response.text();

                    throw new Error(
                        errorText || "Unable to generate budget plan."
                    );
                }


                const result =
                    await response.json();


                /*
                    Recommendation is handled by
                    the separate recommendations page.
                */

                window.location.href =
                    "/party-recommendations";


            } catch (error) {

                console.error(error);

                message.style.display = "block";
                message.className = "error";
                message.textContent =
                    "Unable to generate budget plan. Please try again.";

                button.disabled = false;
                button.textContent =
                    "⚙ Generate Budget Plan";
            }

        });

    </script>

</body>
</html>
