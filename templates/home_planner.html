<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Home Interior Budget Planner - PocketSmart</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: Arial, "Segoe UI", sans-serif;
      background: #f5f7fa;
      color: #26364a;
    }

    .navbar {
      background: #ffffff;
      min-height: 60px;
      padding: 0 35px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      border-bottom: 1px solid #e3e8ee;
    }

    .brand {
      font-size: 22px;
      font-weight: 700;
      color: #245b96;
    }

    .navbar-links {
      display: flex;
      gap: 22px;
      align-items: center;
    }

    .navbar-links a {
      text-decoration: none;
      color: #3d4d60;
      font-size: 14px;
      font-weight: 600;
    }

    .navbar-links a:hover {
      color: #245b96;
    }

    .page-header {
      background: linear-gradient(135deg, #2f659f, #245488);
      color: white;
      text-align: center;
      padding: 30px 20px;
    }

    .page-header h1 {
      margin: 0 0 8px;
      font-size: 27px;
      font-weight: 700;
    }

    .page-header p {
      margin: 0;
      font-size: 14px;
      opacity: 0.95;
    }

    .container {
      width: 92%;
      max-width: 900px;
      margin: 28px auto 50px;
    }

    .planner-box {
      background: #ffffff;
      padding: 22px;
      border-radius: 10px;
      box-shadow: 0 3px 15px rgba(0, 0, 0, 0.08);
    }

    .section {
      background: #edf4f9;
      border-radius: 7px;
      padding: 18px;
      margin-bottom: 18px;
    }

    .section-title {
      display: flex;
      align-items: center;
      gap: 9px;
      font-size: 16px;
      font-weight: 700;
      color: #31536f;
      margin-bottom: 15px;
      text-decoration: underline;
      text-underline-offset: 5px;
    }

    .section-icon {
      width: 20px;
      height: 20px;
      flex-shrink: 0;
      stroke: #2f679f;
      fill: none;
      stroke-width: 1.9;
      stroke-linecap: round;
      stroke-linejoin: round;
    }

    label {
      display: block;
      font-size: 13px;
      font-weight: 600;
      color: #33485c;
      margin-bottom: 7px;
    }

    input[type="number"],
    textarea {
      width: 100%;
      border: 1px solid #d7dfe7;
      background: #ffffff;
      border-radius: 6px;
      padding: 11px 12px;
      font-size: 14px;
      color: #26364a;
      outline: none;
    }

    input[type="number"]:focus,
    textarea:focus {
      border-color: #4380ba;
      box-shadow: 0 0 0 2px rgba(67, 128, 186, 0.12);
    }

    textarea {
      resize: vertical;
      min-height: 85px;
    }

    .field {
      margin-bottom: 16px;
    }

    .two-column {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 18px;
    }

    .room-grid {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 15px;
    }

    .room-option {
      display: flex;
      align-items: center;
      gap: 7px;
      font-size: 14px;
      color: #33485c;
    }

    .room-option input {
      width: 15px;
      height: 15px;
      accent-color: #2e65a0;
    }

    .room-option label {
      display: flex;
      align-items: center;
      gap: 6px;
      margin: 0;
      font-weight: 600;
      cursor: pointer;
    }

    .room-icon {
      width: 17px;
      height: 17px;
      stroke: #326ca8;
      fill: none;
      stroke-width: 1.8;
      stroke-linecap: round;
      stroke-linejoin: round;
    }

    .button-area {
      text-align: center;
      margin-top: 8px;
    }

    .generate-btn {
      border: none;
      background: linear-gradient(135deg, #326ca8, #164d84);
      color: white;
      padding: 12px 28px;
      border-radius: 25px;
      font-size: 14px;
      font-weight: 700;
      cursor: pointer;
      box-shadow: 0 4px 10px rgba(32, 83, 132, 0.25);
    }

    .generate-btn:hover {
      transform: translateY(-1px);
    }

    .generate-btn:disabled {
      opacity: 0.65;
      cursor: wait;
    }

    #loading {
      text-align: center;
      margin-top: 18px;
      color: #2e6194;
      font-size: 14px;
      font-weight: 600;
    }

    .error-box {
      margin-top: 15px;
      padding: 12px;
      border-radius: 6px;
      background: #fdecec;
      color: #a33a3a;
      border: 1px solid #f2caca;
      font-size: 14px;
    }

    @media (max-width: 700px) {
      .navbar {
        padding: 14px 18px;
        flex-direction: column;
        gap: 12px;
      }

      .navbar-links {
        flex-wrap: wrap;
        justify-content: center;
        gap: 12px;
      }

      .page-header h1 {
        font-size: 23px;
      }

      .container {
        width: 94%;
      }

      .two-column {
        grid-template-columns: 1fr;
      }

      .room-grid {
        grid-template-columns: 1fr;
      }
    }
  </style>
</head>

<body>

  <div class="navbar">
    <div class="brand">PocketSmart</div>

    <div class="navbar-links">
      <a href="/dashboard">Dashboard</a>
      <a href="/party-planner">Party Planner</a>
      <a href="/jewelry-planner">Jewelry Planner</a>
      <a href="/history">History</a>
    </div>
  </div>

  <div class="page-header">
    <h1>Home Interior Budget Planner</h1>
    <p>Create a customized budget plan for your dream home interior</p>
  </div>

  <div class="container">

    <div class="planner-box">

      <form id="homeForm">

        <!-- BUDGET -->
        <div class="section">

          <div class="section-title">
            <svg class="section-icon" viewBox="0 0 24 24">
              <circle cx="12" cy="12" r="9"></circle>
              <path d="M12 7v10"></path>
              <path d="M15 9.5c-.7-.7-1.7-1-3-1-1.6 0-2.5.7-2.5 1.7 0 2.6 5.5 1.1 5.5 3.8 0 1.1-1 1.8-2.8 1.8-1.3 0-2.4-.4-3.2-1.2"></path>
            </svg>
            Budget Details
          </div>

          <div class="field">
            <label for="total_budget">Total Budget (₹)</label>

            <input
              type="number"
              id="total_budget"
              name="total_budget"
              min="0"
              step="0.01"
              required
            >
          </div>

        </div>

        <!-- FIXTURES -->
        <div class="section">

          <div class="section-title">
            <svg class="section-icon" viewBox="0 0 24 24">
              <path d="M9 18h6"></path>
              <path d="M10 22h4"></path>
              <path d="M8.5 15.5C7.5 14.5 7 13.2 7 11.8A5 5 0 0 1 17 12c0 1.4-.5 2.6-1.5 3.5-.6.6-1 1.3-1.2 2.1h-4.6c-.2-.8-.6-1.5-1.2-2.1z"></path>
            </svg>
            Fixtures &amp; Furniture
          </div>

          <div class="two-column">

            <div class="field">
              <label for="num_lights">Number of Lights/Fixtures</label>

              <input
                type="number"
                id="num_lights"
                name="num_lights"
                min="0"
                value="0"
              >
            </div>

            <div class="field">
              <label for="num_fans">Number of Ceiling Fans</label>

              <input
                type="number"
                id="num_fans"
                name="num_fans"
                min="0"
                value="0"
              >
            </div>

            <div class="field">
              <label for="num_furniture">Number of Furniture Pieces</label>

              <input
                type="number"
                id="num_furniture"
                name="num_furniture"
                min="0"
                value="0"
              >
            </div>

            <div class="field">
              <label for="num_dining_tables">Number of Dining Tables</label>

              <input
                type="number"
                id="num_dining_tables"
                name="num_dining_tables"
                min="0"
                value="0"
              >
            </div>

          </div>

        </div>

        <!-- ROOMS -->
        <div class="section">

          <div class="section-title">
            <svg class="section-icon" viewBox="0 0 24 24">
              <path d="M3 11.5 12 4l9 7.5"></path>
              <path d="M5 10.5V20h14v-9.5"></path>
              <path d="M9 20v-5h6v5"></path>
            </svg>
            Rooms to Include
          </div>

          <div class="room-grid">

            <div class="room-option">

              <input
                type="checkbox"
                name="has_living_room"
                id="lr"
              >

              <label for="lr">

                <svg class="room-icon" viewBox="0 0 24 24">
                  <path d="M5 11h14a2 2 0 0 1 2 2v5H3v-5a2 2 0 0 1 2-2z"></path>
                  <path d="M5 11V9a3 3 0 0 1 3-3h8a3 3 0 0 1 3 3v2"></path>
                  <path d="M3 18v2"></path>
                  <path d="M21 18v2"></path>
                </svg>

                Living Room

              </label>

            </div>

            <div class="room-option">

              <input
                type="checkbox"
                name="has_kitchen"
                id="kt"
              >

              <label for="kt">

                <svg class="room-icon" viewBox="0 0 24 24">
                  <rect x="4" y="5" width="16" height="15" rx="1"></rect>
                  <path d="M4 10h16"></path>
                  <path d="M8 7.5h.01"></path>
                  <path d="M11 7.5h.01"></path>
                  <path d="M14 13h3"></path>
                  <path d="M7 13h3"></path>
                  <path d="M7 16h3"></path>
                  <path d="M14 16h3"></path>
                </svg>

                Kitchen

              </label>

            </div>

            <div class="room-option">

              <input
                type="checkbox"
                name="has_bedroom"
                id="bd"
              >

              <label for="bd">

                <svg class="room-icon" viewBox="0 0 24 24">
                  <path d="M4 18v-8"></path>
                  <path d="M20 18v-5a2 2 0 0 0-2-2H6a2 2 0 0 0-2 2"></path>
                  <path d="M4 15h16"></path>
                  <path d="M7 11V8h5a2 2 0 0 1 2 2v1"></path>
                  <path d="M4 18v2"></path>
                  <path d="M20 18v2"></path>
                </svg>

                Bedroom

              </label>

            </div>

          </div>

        </div>

        <!-- ADDITIONAL INFORMATION -->
        <div class="section">

          <div class="section-title">
            <svg class="section-icon" viewBox="0 0 24 24">
              <circle cx="12" cy="12" r="9"></circle>
              <path d="M12 10v6"></path>
              <path d="M12 7h.01"></path>
            </svg>
            Additional Information
          </div>

          <div class="field">

            <label for="additional_requirements">
              Special Requirements or Preferences
            </label>

            <textarea
              id="additional_requirements"
              name="additional_requirements"
              placeholder="Any specific requirements or preferences..."
            ></textarea>

          </div>

        </div>

        <!-- BUTTON -->
        <div class="button-area">

          <button
            type="submit"
            class="generate-btn"
            id="generateButton"
          >
            Generate Recommendations
          </button>

        </div>

      </form>

      <div id="loading" style="display:none;">
        Generating your budget plan...
      </div>

      <div id="errorBox"></div>

    </div>

  </div>

  <script>

    const form = document.getElementById("homeForm");

    form.addEventListener("submit", async (e) => {

      e.preventDefault();

      const loading = document.getElementById("loading");
      const errorBox = document.getElementById("errorBox");
      const button = document.getElementById("generateButton");

      loading.style.display = "block";
      errorBox.innerHTML = "";
      button.disabled = true;

      const fd = new FormData(form);

      const payload = {
        total_budget: parseFloat(fd.get("total_budget")),
        num_lights: parseInt(fd.get("num_lights") || 0),
        num_fans: parseInt(fd.get("num_fans") || 0),
        num_furniture: parseInt(fd.get("num_furniture") || 0),
        num_dining_tables: parseInt(fd.get("num_dining_tables") || 0),
        has_living_room: fd.get("has_living_room") === "on",
        has_kitchen: fd.get("has_kitchen") === "on",
        has_bedroom: fd.get("has_bedroom") === "on",
        additional_requirements:
          fd.get("additional_requirements") || null
      };

      try {

        const res = await fetch("/home-budget", {
          method: "POST",
          headers: {
            "Content-Type": "application/json"
          },
          body: JSON.stringify(payload)
        });

        const data = await res.json();

        if (!res.ok) {
          throw new Error(
            data.detail || "Request failed"
          );
        }

        // Go to the separate recommendations page
        window.location.href = "/home-recommendations";

      } catch (err) {

        errorBox.innerHTML =
          `<div class="error-box">${err.message}</div>`;

        loading.style.display = "none";
        button.disabled = false;

      }

    });

  </script>

</body>
</html>
