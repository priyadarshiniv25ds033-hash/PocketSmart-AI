<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sign In - PocketSmart</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      font-family: Arial, Helvetica, sans-serif;
      background: #ffffff;
      color: #173b5f;
    }

    .page {
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding-top: 55px;
    }

    .brand-title {
      text-align: center;
      margin-bottom: 25px;
    }

    .brand-title h1 {
      margin: 0;
      font-size: 30px;
      font-weight: 700;
      color: #245b91;
    }

    .brand-title p {
      margin: 5px 0 0;
      font-size: 13px;
      font-weight: 600;
      color: #555;
    }

    .login-wrapper {
      width: 100%;
      max-width: 400px;
      padding: 12px;
      background: #fafafa;
      border-radius: 25px;
      box-shadow: 0 5px 25px rgba(30, 70, 100, 0.08);
    }

    .login-card {
      background: #ffffff;
      border-radius: 16px;
      padding: 30px 30px 25px;
      box-shadow: 0 3px 15px rgba(0, 0, 0, 0.08);
    }

    .login-card h2 {
      text-align: center;
      margin: 0 0 28px;
      color: #173b5f;
      font-size: 23px;
    }

    .form-group {
      margin-bottom: 18px;
    }

    .form-group label {
      display: block;
      margin-bottom: 8px;
      color: #173b5f;
      font-size: 12px;
      font-weight: 700;
    }

    .input-wrapper {
      position: relative;
    }

    .input-icon {
      position: absolute;
      left: 12px;
      top: 50%;
      transform: translateY(-50%);
      width: 15px;
      height: 15px;
      color: #3976ad;
      z-index: 2;
    }

    .input-wrapper input {
      width: 100%;
      height: 35px;
      border: 1px solid #dfe5e9;
      border-radius: 7px;
      padding: 0 12px 0 35px;
      font-size: 12px;
      outline: none;
      color: #333;
      background: #fff;
    }

    .input-wrapper input:focus {
      border-color: #3976ad;
      box-shadow: 0 0 0 2px rgba(57, 118, 173, 0.08);
    }

    .input-wrapper input::placeholder {
      color: #999;
    }

    .forgot {
      text-align: right;
      margin-top: -7px;
      margin-bottom: 18px;
      font-size: 11px;
      color: #7a9ab8;
      cursor: pointer;
    }

    .signin-btn {
      width: 100%;
      height: 35px;
      border: none;
      border-radius: 20px;
      background: linear-gradient(90deg, #3979b9, #12395f);
      color: white;
      font-size: 12px;
      font-weight: 700;
      cursor: pointer;
      box-shadow: 0 4px 12px rgba(42, 99, 151, 0.25);
    }

    .signin-btn:hover {
      opacity: 0.95;
    }

    .bottom-text {
      text-align: center;
      margin: 20px 0 0;
      color: #444;
      font-size: 12px;
    }

    .bottom-text a {
      color: #3976ad;
      font-weight: 700;
      text-decoration: none;
    }

    .bottom-text a:hover {
      text-decoration: underline;
    }

    #errorBox {
      margin-top: 12px;
    }

    .error-box {
      padding: 8px;
      border-radius: 6px;
      background: #ffe8e8;
      color: #b00020;
      font-size: 12px;
      text-align: center;
    }

    @media (max-width: 500px) {
      .page {
        padding-top: 35px;
      }

      .brand-title h1 {
        font-size: 27px;
      }

      .login-wrapper {
        max-width: 92%;
      }

      .login-card {
        padding: 28px 25px 23px;
      }
    }
  </style>
</head>

<body>

  <div class="page">

    <div class="brand-title">
      <h1>PocketSmart</h1>
      <p>AI-Powered Budget Planning</p>
    </div>

    <div class="login-wrapper">

      <div class="login-card">

        <h2>Welcome Back</h2>

        <form id="loginForm">

          <!-- Username -->
          <div class="form-group">
            <label>Username</label>

            <div class="input-wrapper">

              <span class="input-icon">
                <svg viewBox="0 0 24 24" fill="currentColor">
                  <path d="M12 12a4 4 0 1 0 0-8 4 4 0 0 0 0 8zm0 2c-4.42 0-8 2.24-8 5v1h16v-1c0-2.76-3.58-5-8-5z"/>
                </svg>
              </span>

              <input
                type="text"
                name="username"
                placeholder="Enter your username"
                required
              >

            </div>
          </div>

          <!-- Password -->
          <div class="form-group">
            <label>Password</label>

            <div class="input-wrapper">

              <span class="input-icon">
                <svg viewBox="0 0 24 24" fill="currentColor">
                  <path d="M17 9h-1V7a4 4 0 0 0-8 0v2H7a2 2 0 0 0-2 2v8a2 2 0 0 0 2 2h10a2 2 0 0 0 2-2v-8a2 2 0 0 0-2-2zm-7-2a2 2 0 0 1 4 0v2h-4V7zm7 12H7v-8h10v8z"/>
                </svg>
              </span>

              <input
                type="password"
                name="password"
                placeholder="Enter your password"
                required
              >

            </div>
          </div>

          <div class="forgot">
            Forgot Password?
          </div>

          <button type="submit" class="signin-btn">
            Sign In →
          </button>

        </form>

        <div id="errorBox"></div>

        <p class="bottom-text">
          Don't have an account?
          <a href="/register">Create Account</a>
        </p>

      </div>
    </div>

  </div>

  <script>
    document.getElementById("loginForm").addEventListener("submit", async (e) => {

      e.preventDefault();

      const formData = new FormData(e.target);

      const res = await fetch("/login", {
        method: "POST",
        body: formData
      });

      if (res.redirected) {
        window.location.href = res.url;
      } else {

        const data = await res.json().catch(() => ({
          detail: "Login failed"
        }));

        document.getElementById("errorBox").innerHTML =
          `<div class="error-box">${data.detail || "Login failed"}</div>`;
      }

    });
  </script>

</body>
</html>
